<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Redirecting</title>
<script>
/* Old address. Sends old links to the new pages. */
var h = location.hash;
location.replace(h === '#a' ? 'flow-a.html' : h === '#b' ? 'flow-b.html' : 'index.html');
</script></head><body><p><a href="index.html">Go to the home page</a></p></body></html>
